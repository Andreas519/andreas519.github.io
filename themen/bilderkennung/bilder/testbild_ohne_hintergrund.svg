<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1402" height="1122" viewBox="0 0 1402 1122">
  <defs>
    <radialGradient id="redGradient" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#ff1717"/>
      <stop offset="72%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#ed0000"/>
    </radialGradient>

    <radialGradient id="blueGradient" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#174dff"/>
      <stop offset="72%" stop-color="#0644f2"/>
      <stop offset="100%" stop-color="#003bdc"/>
    </radialGradient>

    <radialGradient id="greenGradient" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#13da22"/>
      <stop offset="72%" stop-color="#06c819"/>
      <stop offset="100%" stop-color="#00af11"/>
    </radialGradient>

    <radialGradient id="yellowGradient" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#fff51b"/>
