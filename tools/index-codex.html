<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Tools - Code & Markdown Viewer</title>
  <meta name="author" content="GitHub Copilot">
  <meta name="client" content="Andreas Sigismund">
  <meta name="description" content="Viewer-Tools für Code- und Markdown-Dateien">
  <link rel="stylesheet" href="../css/my.css">
  <style>
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .tool-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      background: #fff;
    }

    .tool-card h3 {
      margin-top: 0;
      color: var(--accent);
    }

    .tool-card p {
      line-height: 1.6;
      margin: 12px 0;
      font-size: 0.95em;
    }

    .tool-card .example {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
      overflow-x: auto;
    }

    .tool-card .example-title {
      font-weight: 600;
      font-size: 0.9em;
      margin-bottom: 8px;
      color: #333;
    }

    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9em;
    }

    .btn:hover {
      text-decoration: none;
      opacity: 0.8;
    }

    .btn-secondary {
      background: #eef4ff;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-secondary:hover {
      background: #dce9ff;
    }

    .params-table {
      width: 100%;
      font-size: 0.9em;
      margin-top: 12px;
      border-collapse: collapse;
    }

    .params-table th,
    .params-table td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: left;
    }

    .params-table th {
      background: #f5f5f5;
      font-weight: 600;
    }

    .params-table code {
      background: #fff;
      padding: 0;
      font-size: 0.9em;
    }
  </style>
</head>

    <h1>Codex - </h1>
  </header>
