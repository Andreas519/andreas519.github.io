<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Young Engineers</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --shadow: rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background: var(--bg);
      }

      body {
        display: grid;
        place-items: center;
      }

      .frame {
        background: var(--panel);
        border-radius: 18px;
        box-shadow: 0 18px 40px var(--shadow);
        padding: 18px;
        text-align: center;
      }

      img {
        display: block;
        max-width: min(92vw, 1100px);
        height: auto;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <img
        src="bilder/projekt-young-engineers.png"
        alt="Projekt Young Engineers"
        ondblclick="window.location.href='index.html'"
      />
    </div>
  </body>
</html>
